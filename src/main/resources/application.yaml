spring:
  application:
    name: muly

  datasource:
    url: jdbc:postgresql://localhost:5432/muly
    username: muly
    password: muly
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:...
  expiration-ms: 86400000