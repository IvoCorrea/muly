services:
  postgres:
    image: postgres:16-alpine
    container_name: muly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: muly
      POSTGRES_USER: muly
      POSTGRES_PASSWORD: muly
    ports:
      - "5432:5432"
    volumes:
      - muly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U muly -d muly" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  muly_pgdata: