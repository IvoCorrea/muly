spring:
  application:
    name: muly
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/muly}
    username: ${DB_USERNAME:muly}
    password: ${DB_PASSWORD:muly}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${EXPIRATION_MS}

cors:
  allowed-origin: ${FRONTEND_URL}

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:}
  client-secret: ${SPOTIFY_CLIENT_SECRET:}

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY:}
  public-key: ${IMAGEKIT_PUBLIC_KEY:}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}
